<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Home</a> |
        <a href="add-blog.html">Add Blog</a>
    </nav>

    <h1>Add a New Blog</h1>

    <form onsubmit="submitBlog(event)">
        <label for="title">Blog Title</label><br>
        <input type="text" id="title" placeholder="Enter blog title"><br><br>

        <label for="content">Blog Content</label><br>
        <textarea id="content" rows="6" placeholder="Write your blog here"></textarea><br><br>

        <label for="category">Category</label><br>

        <select id="category">
         <option value="Technology">Technology</option>
         <option value="Education">Education</option>
         <option value="Health">Health</option>
         <option value="Travel">Travel</option>
        </select>

        <br><br>

        <button type="submit">Submit</button>
    </form>

    <footer>
        <p>&copy; 2026 Blog Website. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
